apiVersion: apps/v1
kind: Deployment
metadata:
  name: vizag-frontend
  namespace: vizag

spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      imagePullSecrets:
      - name: dockerhub-secret

      containers:
      - name: frontend
        image: sreenu8143/sreenu:vizag-frontend-v1

        ports:
        - containerPort: 80