apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: vizag-ingress
  namespace: vizag

spec:
  ingressClassName: nginx

  rules:
  - host: vizag.local

    http:
      paths:

      - path: /
        pathType: Prefix

        backend:
          service:
            name: frontend-service
            port:
              number: 80